<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#185FA5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c3360"  media="(prefers-color-scheme: dark)"  />
  <meta name="description" content="Acesse o Controle de Horas com seu e-mail e senha." />
  <title>Entrar — Controle de Horas</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/login.css" />
</head>
<body>
  <div class="login-bg">
    <div class="login-card">

      <div class="login-header">
        <div class="login-logo">
          <svg viewBox="0 0 40 40" fill="none" role="img" aria-label="Controle de Horas">
            <rect width="40" height="40" rx="11" fill="#185FA5"/>
            <circle cx="20" cy="20" r="10" stroke="white" stroke-width="1.8"/>
            <path d="M20 13v7l4 4" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="login-title">Controle de Horas</h1>
        <p class="login-sub">Entre com sua conta para continuar</p>
      </div>

      <form class="login-form" id="login-form" novalidate autocomplete="on">

        <!-- E-mail -->
        <div class="field-group" id="fg-email">
          <label class="field-label" for="email">E-mail</label>
          <div class="field-wrap">
            <span class="field-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              class="field-input"
              placeholder="seu@email.com"
              autocomplete="email"
              inputmode="email"
              spellcheck="false"
              autocapitalize="none"
              aria-describedby="email-error"
              aria-required="true"
            />
          </div>
          <span class="field-error" id="email-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Senha -->
        <div class="field-group" id="fg-password">
          <div class="field-label-row">
            <label class="field-label" for="password">Senha</label>
            <button type="button" class="forgot-link" onclick="showForgot()">Esqueceu a senha?</button>
          </div>
          <div class="field-wrap">
            <span class="field-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              class="field-input"
              placeholder="Mínimo 8 caracteres"
              autocomplete="current-password"
              aria-describedby="password-error"
              aria-required="true"
            />
            <button
              type="button"
              class="toggle-pw"
              id="toggle-pw"
              aria-label="Mostrar senha"
              onclick="togglePassword()"
            >
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="password-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Força da senha -->
        <div class="pw-strength" id="pw-strength" aria-label="Indicador de força da senha" role="status">
          <div class="pw-bars" aria-hidden="true">
            <div class="pw-bar" id="bar-1"></div>
            <div class="pw-bar" id="bar-2"></div>
            <div class="pw-bar" id="bar-3"></div>
            <div class="pw-bar" id="bar-4"></div>
          </div>
          <span class="pw-label" id="pw-label"></span>
        </div>

        <!-- Alert global -->
        <div class="form-alert" id="form-alert" role="alert" aria-live="assertive"></div>

        <!-- Submit -->
        <button type="submit" class="btn-submit" id="btn-submit">
          <span id="btn-text">Entrar</span>
          <span id="btn-loader" class="btn-loader" hidden aria-hidden="true"></span>
        </button>

      </form>

      <p class="login-footer">
        Não tem conta?
        <button type="button" class="link-btn" onclick="showRegister()">Criar conta</button>
      </p>

    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/src/login.js"></script>
</body>
</html>

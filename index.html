<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Controle de horas trabalhadas com calendário e resumo mensal." />
  <meta name="theme-color" content="#180E0E" />
  <title>Controle de Horas</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="container">

    <header class="site-header">
      <div class="header-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect width="28" height="28" rx="8" fill="#F2542D"/>
          <circle cx="14" cy="14" r="7" stroke="#F5DFBB" stroke-width="1.5"/>
          <path d="M14 10v4l2.5 2.5" stroke="#F5DFBB" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Controle de Horas
      </div>
      <p class="header-sub">Registre reuniões, atividades e pausas — o resumo é calculado automaticamente.</p>
    </header>

    <div class="topbar">
      <div class="topbar-user" id="topbar-user"></div>
      <div class="topbar-actions">
        <button class="btn-action btn-add-day" onclick="addDay()">+ Adicionar dia</button>
        <button class="btn-action btn-rem-day" id="btn-rem" onclick="toggleRemoveMode()">− Remover dia</button>
        <div class="vdivider" aria-hidden="true"></div>
        <button class="btn-action btn-cal" id="btn-cal" onclick="toggleCal()">&#128197; Calendário</button>
        <div class="vdivider" aria-hidden="true"></div>
        <button class="btn-action btn-logout" onclick="logout()">Sair</button>
      </div>
    </div>

    <div id="hint-wrap" role="status" aria-live="polite"></div>
    <div id="cal-wrap"></div>
    <main id="app-body"></main>

  </div>

  <script src="/src/app.js"></script>
</body>
</html>

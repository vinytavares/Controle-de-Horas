<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1A0F0F" />
  <title>Entrar — Controle de Horas</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/login.css" />
</head>
<body>

  <!-- Decorative background shapes -->
  <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb-2" aria-hidden="true"></div>

  <!-- Sparkle decorations -->
  <div class="sparkle sp-1" aria-hidden="true">
    <svg viewBox="0 0 40 40" fill="none"><path d="M20 0 L22 18 L40 20 L22 22 L20 40 L18 22 L0 20 L18 18 Z" fill="currentColor"/></svg>
  </div>
  <div class="sparkle sp-2" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 0 L13 11 L24 12 L13 13 L12 24 L11 13 L0 12 L11 11 Z" fill="currentColor"/></svg>
  </div>
  <div class="sparkle sp-3" aria-hidden="true">
    <svg viewBox="0 0 32 32" fill="none"><path d="M16 0 L17.5 14.5 L32 16 L17.5 17.5 L16 32 L14.5 17.5 L0 16 L14.5 14.5 Z" fill="currentColor"/></svg>
  </div>

  <div class="login-root">

    <!-- Left panel (decorative, desktop only) -->
    <aside class="login-side" aria-hidden="true">
      <div class="side-inner">
        <div class="side-badge">Sistema de Controle</div>
        <p class="side-headline">Saiba exatamente<br/>onde seu<br/><em>tempo</em> vai.</p>
        <div class="side-stats">
          <div class="stat"><span class="stat-num">8h</span><span class="stat-lbl">sessão segura</span></div>
          <div class="stat"><span class="stat-num">3</span><span class="stat-lbl">tipos de entrada</span></div>
          <div class="stat"><span class="stat-num">∞</span><span class="stat-lbl">dias registrados</span></div>
        </div>
        <div class="side-ticker" aria-label="Categorias">
          <span>Reuniões</span><span class="dot">✦</span>
          <span>Atividades</span><span class="dot">✦</span>
          <span>Pausas</span><span class="dot">✦</span>
          <span>Resumo Mensal</span>
        </div>
      </div>
    </aside>

    <!-- Right panel (form) -->
    <main class="login-main">
      <div class="login-card">

        <div class="login-logo-wrap">
          <div class="login-logo">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
              <rect width="36" height="36" rx="10" fill="#F2542D"/>
              <circle cx="18" cy="18" r="9" stroke="#F5DFBB" stroke-width="1.8"/>
              <path d="M18 12v6l4 4" stroke="#F5DFBB" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="login-brand">Controle de Horas</span>
        </div>

        <div class="login-heading">
          <h1>Bem-vindo<span class="accent">.</span></h1>
          <p>Entre com sua conta para continuar</p>
        </div>

        <form class="login-form" id="login-form" novalidate autocomplete="on">

          <div class="field-group" id="fg-email">
            <label class="field-label" for="email">E-mail</label>
            <div class="field-wrap">
              <span class="field-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
              </span>
              <input type="email" id="email" name="email" class="field-input"
                placeholder="seu@email.com" autocomplete="email" inputmode="email"
                spellcheck="false" autocapitalize="none"
                aria-describedby="email-error" aria-required="true"
              />
            </div>
            <span class="field-error" id="email-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="field-group" id="fg-password">
            <div class="field-label-row">
              <label class="field-label" for="password">Senha</label>
              <button type="button" class="forgot-link" onclick="showForgot()">Esqueceu?</button>
            </div>
            <div class="field-wrap">
              <span class="field-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="password" name="password" class="field-input"
                placeholder="Mínimo 8 caracteres" autocomplete="current-password"
                aria-describedby="password-error" aria-required="true"
              />
              <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Mostrar senha" onclick="togglePassword()">
                <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="password-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="pw-strength" id="pw-strength" role="status" aria-label="Força da senha">
            <div class="pw-bars" aria-hidden="true">
              <div class="pw-bar" id="bar-1"></div>
              <div class="pw-bar" id="bar-2"></div>
              <div class="pw-bar" id="bar-3"></div>
              <div class="pw-bar" id="bar-4"></div>
            </div>
            <span class="pw-label" id="pw-label"></span>
          </div>

          <div class="form-alert" id="form-alert" role="alert" aria-live="assertive"></div>

          <button type="submit" class="btn-submit" id="btn-submit">
            <span id="btn-text">Entrar</span>
            <span class="btn-arrow" id="btn-arrow" aria-hidden="true">→</span>
            <span id="btn-loader" class="btn-loader" hidden aria-hidden="true"></span>
          </button>

        </form>

        <p class="login-footer">
          Não tem conta?
          <a href="/register" class="link-btn">Criar acesso</a>
        </p>

      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/public/supabase.min.js"></script>
  <script src="/src/api.js"></script>
  <script src="/src/login.js"></script>
</body>
</html>

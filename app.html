<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Controle de horas trabalhadas com calendário e resumo mensal." />
  <meta name="theme-color" content="#180E0E" />
  <title>Controle de Horas</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <!-- Decorative background (igual ao login) -->
  <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb-2" aria-hidden="true"></div>
  <div class="sparkle sp-1" aria-hidden="true">
    <svg viewBox="0 0 40 40" fill="none"><path d="M20 0 L22 18 L40 20 L22 22 L20 40 L18 22 L0 20 L18 18 Z" fill="currentColor"/></svg>
  </div>
  <div class="sparkle sp-2" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 0 L13 11 L24 12 L13 13 L12 24 L11 13 L0 12 L11 11 Z" fill="currentColor"/></svg>
  </div>

  <div class="container">

    <header class="site-header">
      <div class="header-top">
        <div class="header-logo">
          <div class="header-logo-mark">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
              <rect width="36" height="36" rx="10" fill="#F2542D"/>
              <circle cx="18" cy="18" r="9" stroke="#F5DFBB" stroke-width="1.8"/>
              <path d="M18 12v6l4 4" stroke="#F5DFBB" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="header-brand">Controle de Horas</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px"><span id="save-status" style="font-size:11px;opacity:0;transition:opacity .3s"></span><div class="topbar-user" id="topbar-user"></div></div>
      </div>

      <div class="header-hero">
        <span class="header-badge">Painel de controle</span>
        <h1 class="header-headline">Saiba onde seu <em>tempo</em> vai.</h1>
        <p class="header-sub">Registre reuniões, atividades e pausas — o resumo é calculado automaticamente.</p>
      </div>
    </header>

    <div class="topbar">
      <div></div>
      <div class="topbar-actions">
        <button class="btn-action btn-add-day" onclick="addDay()">+ Adicionar dia</button>
        <button class="btn-action btn-rem-day" id="btn-rem" onclick="toggleRemoveMode()">− Remover dia</button>
        <div class="vdivider" aria-hidden="true"></div>
        <button class="btn-action btn-cal" id="btn-cal" onclick="toggleCal()">&#128197; Calendário</button>
        <div class="vdivider" aria-hidden="true"></div>
        <button class="btn-action btn-logout" onclick="logout()">Sair</button>
      </div>
    </div>

    <div id="hint-wrap" role="status" aria-live="polite"></div>
    <div id="cal-wrap"></div>
    <main id="app-body"></main>

    <footer class="site-footer">
      <span>Reuniões</span><span class="dot">✦</span>
      <span>Atividades</span><span class="dot">✦</span>
      <span>Pausas</span><span class="dot">✦</span>
      <span>Resumo Mensal</span>
    </footer>

  </div>

  <script src="/public/supabase.min.js"></script>
  <script src="/src/api.js"></script>
  <script src="/src/app.js"></script>
</body>
</html>
